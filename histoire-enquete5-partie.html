<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histoire – Enquête 5 – Partie</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f1ea;color:#222;font-size:20px;line-height:1.35}
.wrap{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:8px 0}
.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 2px 10px #0002;margin:14px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:18px;margin:10px 0;font-size:20px;font-weight:600;background:#2f6fed;color:#fff;cursor:pointer;text-align:left}
.btn.alt{background:#fff;color:#222;border:3px solid #2f6fed}
.btn.good{background:#2e9e5b;color:#fff;border-color:#2e9e5b}
.btn.bad{background:#d64545;color:#fff;border-color:#d64545}
.btn:disabled{cursor:default}
.bar{height:16px;background:#ddd;border-radius:8px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:#2e9e5b;width:0;transition:width .3s}
.big{font-size:60px;text-align:center}
.tag{display:inline-block;padding:4px 12px;border-radius:12px;background:#e8eefc;font-size:16px;font-weight:600}
.fb{font-size:19px;padding:12px;border-radius:12px;background:#eef8f1;margin-top:8px}
.flip{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:24px;cursor:pointer}
.row{display:flex;gap:10px}.row .btn{text-align:center}
.small{font-size:16px;color:#555}
</style>

<body>

<div class="wrap" id="app"></div>
<script>
const Q=[
{t:"🍞 Alimentation",q:"Quelle est la base de l'alimentation du paysan ?",a:["Pain et bouillie de céréales","Viandes variées et gibier","Poisson et épices"],c:0,e:"Le paysan mange surtout du pain et de la bouillie."},
{t:"🍞 Alimentation",q:"Qu'est-ce que le sarrasin ?",a:["Le blé noir","Une épice","Une boisson"],c:0,e:"Le sarrasin = blé noir, il améliore la nourriture du paysan."},
{t:"🍞 Alimentation",q:"Quelle boisson boit surtout le paysan ?",a:["La bière (cervoise)","Le vin tous les jours","Le café"],c:0,e:"Le vin est rare pour le peuple."},
{t:"🍞 Alimentation",q:"Pourquoi les nobles utilisent-ils des épices ?",a:["Pour relever les sauces et cacher le goût fort des viandes","Pour soigner les malades","Pour conserver le pain"],c:0,e:"Les épices relèvent les sauces et cachent le goût trop fort des viandes."},
{t:"🍞 Alimentation",q:"Qui joue de la musique pendant le banquet du seigneur ?",a:["Les ménestrels","Les paysans","Les moines"],c:0,e:"Les ménestrels amusent la compagnie avec leurs instruments."},
{t:"🍞 Alimentation",q:"Combien de fois par an le peuple mange-t-il de la viande (Vauban, 1697) ?",a:["Pas trois fois","Tous les jours","Chaque semaine"],c:0,e:"« Pas trois fois de la viande en un an »."},
{t:"🌾 Rendements",q:"Pourquoi les rendements sont-ils faibles au début du Moyen Âge ?",a:["Les outils sont rudimentaires","Il y a trop de machines","Les champs sont trop petits"],c:0,e:"Houe, faucille, fléau : le travail est lent et peu efficace."},
{t:"🌾 Rendements",q:"Qu'est-ce que le rendement ?",a:["Ce qu'on récolte par rapport à ce qu'on a semé","Le prix du pain","Le nombre de paysans"],c:0,e:"Rendement = récolte comparée à la semence."},
{t:"🌾 Rendements",q:"Quel progrès tire jusqu'à 500 kg sans étouffer le cheval ?",a:["Le collier d'épaule","Le collier de cou","Le moulin à vent"],c:0,e:"Le collier d'épaule n'étouffe pas l'animal."},
{t:"🌾 Rendements",q:"À quoi sert le moulin à vent ?",a:["Moudre les grains en farine","Labourer","Couper les arbres"],c:0,e:"Il moud les céréales pour faire de la farine."},
{t:"🌾 Rendements",q:"Qu'est-ce que la jachère ?",a:["Une terre laissée au repos","Une récolte de blé","Un outil"],c:0,e:"La jachère = terre au repos."},
{t:"🌾 Rendements",q:"Assolement triennal : en combien de soles divise-t-on le champ ?",a:["3","2","12"],c:0,e:"3 soles : céréale d'hiver, céréale de printemps (ou légumineuse), jachère."},
{t:"🌾 Rendements",q:"De 1000 à 1250, la population européenne augmente de…",a:["27 millions (42 → 69)","5 millions","100 millions"],c:0,e:"De 42 à 69 millions d'habitants."},
{t:"⚔️ Classes sociales",q:"Quel est le rôle des prêtres ?",a:["Prier","Protéger par les armes","Cultiver la terre"],c:0,e:"Les prêtres prient."},
{t:"⚔️ Classes sociales",q:"Quel est le rôle des combattants (nobles) ?",a:["Protéger","Prier","Nourrir"],c:0,e:"Les combattants protègent par les armes."},
{t:"⚔️ Classes sociales",q:"Quel est le rôle des paysans ?",a:["Travailler la terre et nourrir","Rendre la justice","Prier"],c:0,e:"Les paysans travaillent et nourrissent tout le monde."},
{t:"⚔️ Classes sociales",q:"Dans le texte de 1036, les trois ordres sont…",a:["Complémentaires","Ennemis","Tous pareils"],c:0,e:"Chacun est utile aux autres."},
{t:"⚔️ Classes sociales",q:"Quelle différence entre serf et vilain ?",a:["Le vilain est libre ; le serf dépend du seigneur","Le serf est libre","Aucune"],c:0,e:"Le serf ne peut ni partir, ni se marier, ni transmettre ses biens sans accord."},
{t:"⚔️ Classes sociales",q:"Le cens, c'est…",a:["Une taxe payée au seigneur","Un outil","Un château"],c:0,e:"Le cens est une taxe sur la tenure."},
{t:"⚔️ Classes sociales",q:"Les banalités, ce sont…",a:["Les taxes pour utiliser moulin, four, pressoir","Les fêtes du village","Les armes du chevalier"],c:0,e:"Moulin banal, four banal, pressoir."},
{t:"⚔️ Classes sociales",q:"La corvée, c'est…",a:["Un travail gratuit pour le seigneur","Une taxe en argent","Un repas"],c:0,e:"Travail gratuit sur la réserve du seigneur."}
];
const F=[
["Pain et bouillie","Base de l'alimentation du paysan"],["Sarrasin","Blé noir"],["Cervoise","Bière"],["Ménestrel","Musicien du Moyen Âge"],
["Jachère","Terre au repos"],["Assolement triennal","Champ divisé en 3 soles, tournantes"],["Collier d'épaule","Permet de tirer jusqu'à 500 kg sans étouffer l'animal"],["Moulin à vent","Moud les grains en farine"],["Défrichement","Couper la forêt pour cultiver"],
["Prêtres","Ceux qui prient"],["Combattants","Ceux qui protègent"],["Paysans","Ceux qui travaillent et nourrissent"],["Cens","Taxe payée au seigneur"],["Corvée","Travail gratuit pour le seigneur"],["Banalités","Taxes : moulin, four, pressoir"],["Vilain","Paysan libre"],["Serf","Paysan non libre"],["Laïc","Qui n'est pas du clergé"],["Ecclésiastique","Membre du clergé"],["Vassal","Guerrier au service d'un seigneur"],["Suzerain","Seigneur dont dépend un vassal"]
];
const SORT=[
["Pain et bouillie","P"],["Gibier","N"],["Épices","N"],["Sarrasin","P"],["Cervoise","P"],["Banquet avec ménestrels","N"],["Fèves et pois","P"],["Poisson, viandes variées","N"],["Pas de sel (très peu)","P"],["Vin à table","N"]
];
const app=document.getElementById('app');
let stars=0;try{stars=+localStorage.getItem('h2g_stars')||0}catch(e){}
function save(){try{localStorage.setItem('h2g_stars',stars)}catch(e){}}
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function home(){
app.innerHTML=`<h1>📚 Histoire – Enquête 5 – Partie</h1><div class="small">2G · Séances courtes de 5 questions</div>
<div class="card"><b>⭐ ${stars} étoiles</b></div>
<button class="btn" onclick="quiz()">🎯 Quiz rapide (5 questions)</button>
<button class="btn" onclick="quiz('🍞 Alimentation')">🍞 Quiz : alimentation</button>
<button class="btn" onclick="quiz('🌾 Rendements')">🌾 Quiz : rendements</button>
<button class="btn" onclick="quiz('⚔️ Classes sociales')">⚔️ Quiz : classes sociales</button>
<button class="btn" onclick="open_()">📝 Questions ouvertes (écrire sa réponse)</button>
<button class="btn" onclick="docs()">🕵️ Détective des documents</button>
<button class="btn" onclick="syn()">✍️ S'entraîner à la synthèse</button>
<button class="btn alt" onclick="cards()">🃏 Cartes de vocabulaire</button>
<button class="btn alt" onclick="sort()">🍽️ Jeu : paysan ou noble ?</button>
<div class="small">Tout est visuel, sans son. Pause conseillée après chaque série.</div>`}
let qs,qi,sc;
function quiz(th){qs=shuf(Q.filter(x=>!th||x.t===th)).slice(0,5);qi=0;sc=0;showQ()}
function showQ(){
if(qi>=qs.length)return endQ();
const x=qs[qi],opts=shuf(x.a.map((t,i)=>({t,ok:i===x.c})));
app.innerHTML=`<div class="bar"><i style="width:${qi/qs.length*100}%"></i></div><span class="tag">${x.t} · ${qi+1}/${qs.length}</span>
<div class="card"><b>${x.q}</b></div><div id="o"></div><div id="f"></div>`;
const o=document.getElementById('o');
opts.forEach(p=>{const b=document.createElement('button');b.className='btn alt';b.textContent=p.t;
b.onclick=()=>{[...o.children].forEach((c,i)=>{c.disabled=true;if(opts[i].ok)c.className='btn good'});
if(p.ok){sc++;stars++;save()}else b.className='btn bad';
document.getElementById('f').innerHTML=`<div class="fb">${p.ok?'✅ Bravo !':'❌ Pas tout à fait.'} ${x.e}</div><button class="btn" onclick="qi++;showQ()">Suivant ➡️</button>`};
o.appendChild(b)})}
function endQ(){
app.innerHTML=`<div class="big">${sc>=4?'🏆':sc>=2?'👍':'💪'}</div><div class="card"><b>${sc} / ${qs.length}</b> bonnes réponses.<br>⭐ Total : ${stars}</div>
<div class="card">🧘 <b>Pause !</b> Lève-toi, bois de l'eau, étire-toi 1 minute. Puis recommence.</div>
<button class="btn" onclick="quiz()">Encore 5 questions</button><button class="btn alt" onclick="home()">🏠 Accueil</button>`}
let fc,fi,fr;
function cards(){fc=shuf(F);fi=0;fr=false;showC()}
function showC(){
if(fi>=fc.length){home();return}
const c=fc[fi];
app.innerHTML=`<div class="bar"><i style="width:${fi/fc.length*100}%"></i></div><span class="tag">Carte ${fi+1}/${fc.length}</span>
<div class="card flip" onclick="fr=!fr;showC()">${fr?c[1]:'<b>'+c[0]+'</b>'}</div>
<div class="small">Touche la carte pour la retourner.</div>
<div class="row"><button class="btn bad" onclick="fi++;fr=false;showC()">Je révise encore</button><button class="btn good" onclick="stars++;save();fi++;fr=false;showC()">Je sais ✓</button></div>
<button class="btn alt" onclick="home()">🏠 Accueil</button>`}
let si,ss,sl;
function sort(){sl=shuf(SORT).slice(0,8);si=0;ss=0;showS()}
function showS(){
if(si>=sl.length){stars+=ss;save();app.innerHTML=`<div class="big">🎉</div><div class="card"><b>${ss} / ${sl.length}</b><br>⭐ +${ss}</div><button class="btn" onclick="sort()">Rejouer</button><button class="btn alt" onclick="home()">🏠 Accueil</button>`;return}
app.innerHTML=`<div class="bar"><i style="width:${si/sl.length*100}%"></i></div><div class="card flip"><b>${sl[si][0]}</b></div><div id="f"></div>
<div class="row" id="r"><button class="btn alt" onclick="ans('P')">🧑‍🌾 Paysan</button><button class="btn alt" onclick="ans('N')">🏰 Noble</button></div>`}
function ans(k){const ok=sl[si][1]===k;if(ok)ss++;
document.getElementById('r').innerHTML='';
document.getElementById('f').innerHTML=`<div class="fb">${ok?'✅ Bravo !':'❌ C\'était : '+(sl[si][1]==='P'?'🧑‍🌾 Paysan':'🏰 Noble')}</div><button class="btn" onclick="si++;showS()">Suivant ➡️</button>`}

const OPEN=[
{q:"Explique l'assolement triennal et la jachère.",k:["3 soles","céréale d'hiver","céréale de printemps","jachère = terre au repos"],m:"L'assolement triennal divise le champ cultivé en trois soles : une sole de céréale d'hiver (blé), une sole de céréale de printemps (orge, avoine) ou de légumineuse, et une sole de jachère. Chaque année on change. La jachère est une terre laissée au repos."},
{q:"Compare l'alimentation du paysan et celle du seigneur.",k:["pain, bouillie","peu variée","viandes, gibier","épices","banquet"],m:"Le paysan mange surtout du pain, de la bouillie et des galettes de sarrasin, avec quelques légumes (fèves, pois, poireaux), très peu de sel et presque jamais de viande ; il boit de la bière. Le seigneur mange des viandes variées, du gibier, du poisson, des fruits, avec des épices, et boit du vin lors de banquets avec ménestrels."},
{q:"Quels sont les trois ordres ? Quel est le rôle de chacun ? Pourquoi sont-ils complémentaires ?",k:["prêtres prient","combattants protègent","paysans travaillent / nourrissent","complémentaires, chacun utile aux autres"],m:"Les prêtres prient, les combattants protègent par les armes, les paysans travaillent la terre et nourrissent tout le monde. Ils sont complémentaires : les prêtres prient pour tous, les combattants défendent les autres et les paysans les nourrissent (texte de 1036)."},
{q:"Quelle différence y a-t-il entre un serf et un vilain ? Cite trois obligations du paysan.",k:["vilain libre","serf non libre","cens, taille, corvées, banalités"],m:"Le vilain est un paysan libre. Le serf ne peut ni quitter la seigneurie, ni se marier, ni transmettre ses biens sans l'accord du seigneur. Le paysan doit le cens, la taille, des corvées, les banalités (moulin, four, pressoir) et le champart."},
{q:"Explique la vassalité : qui est lié, et quelles sont les obligations de chacun ?",k:["suzerain et vassal","protection","fief","conseil","aide militaire","aide financière"],m:"La vassalité lie un suzerain (seigneur puissant) à son vassal. Le seigneur doit protection et entretien par un fief. Le vassal doit le conseil, l'aide militaire (défendre, garder le château, partir en guerre, 40 jours) et l'aide financière (mariage de la fille, adoubement du fils, rançon, croisade)."},
{q:"Décris la cérémonie de l'hommage.",k:["mains jointes","« Je le veux »","baiser","serment de fidélité","reliques","investiture / fief"],m:"Le futur vassal met ses mains jointes dans celles du seigneur et répond « Je le veux », puis ils s'unissent par un baiser. Il jure fidélité sur des reliques. Enfin, le seigneur lui remet un fief : c'est l'investiture."},
{q:"Pourquoi construit-on des châteaux forts et quelles sont leurs fonctions ?",k:["autorité","protection / sécurité","bois puis pierre","fonction économique (redevances)","lieu de vie, banquets"],m:"Le château affirme l'autorité du seigneur, impressionne les rivaux et protège la population contre les pillards. D'abord en bois, puis en pierre (dès le XIIe siècle). Il a une fonction militaire, économique (le seigneur reçoit les redevances) et sert de lieu de vie, de loisirs et de banquets."},
{q:"Pourquoi les rendements sont-ils faibles au début, et quelles innovations les améliorent ?",k:["outils rudimentaires","charrue","collier d'épaule","moulin à vent","assolement triennal"],m:"Les outils sont rudimentaires (houe, faucille, fléau), donc le travail est lent. Ensuite apparaissent la charrue, le collier d'épaule, le moulin à vent et l'assolement triennal, qui augmentent la production de nourriture."},
{q:"Quel est le rôle du chevalier dans la société ?",k:["défendre / protéger les faibles","loyal, preux","adoubement","tournoi","déshonneur"],m:"Le chevalier protège les faibles, secourt les pauvres, punit les voleurs et juge avec équité. Il est loyal et preux, craint le déshonneur plus que la mort. Il devient chevalier lors de l'adoubement et s'entraîne dans les tournois."},
{q:"Quels sont les devoirs du chrétien et que risque-t-il s'il ne les respecte pas ?",k:["confession","pénitence","communion à Pâques","interdit d'église","sans sépulture chrétienne"],m:"Le chrétien doit se confesser au moins une fois par an, faire sa pénitence et communier à Pâques (concile de Latran, 1215). Sinon, l'entrée de l'église lui est interdite et il est privé de sépulture chrétienne."},
{q:"Pourquoi dit-on que le XIVe siècle est « maudit » ?",k:["famine (1316)","peste","massacres des Juifs","flagellants"],m:"Le XIVe siècle connaît la famine (1316, pluies et mauvaises récoltes), la peste de 1348-1350 qui tue énormément, des massacres de Juifs accusés d'avoir empoisonné les fontaines et des processions de flagellants qui font pénitence."}
];
const DOCS=[
{d:"Miniature de 1448 conservée à la Bibliothèque royale de Bruxelles",t:"Trace du passé",n:"Iconographique"},
{d:"Copie manuscrite des articles de la loi salique (VIIIe siècle)",t:"Trace du passé",n:"Écrit"},
{d:"Dessin moderne : reconstitution d'une motte du Xe-XIe siècle",t:"Travail postérieur",n:"Iconographique"},
{d:"Donjon de Franchimont (Liège), XIe siècle",t:"Trace du passé",n:"Archéologique"},
{d:"Extrait de la chronique de Gilles Le Muisit, abbé de Tournai (vers 1350)",t:"Trace du passé",n:"Écrit"},
{d:"Extrait d'un manuel scolaire d'histoire publié en 2010",t:"Travail postérieur",n:"Écrit"},
{d:"La moisson, peinture d'Abel Grimmer (1607)",t:"Trace du passé",n:"Iconographique"},
{d:"Description de l'élection de Vézelay par Vauban (1697)",t:"Trace du passé",n:"Écrit"},
{d:"Château de Spontin (XVIe siècle, province de Namur)",t:"Trace du passé",n:"Archéologique"},
{d:"Texte du « Livre des Propriétés des choses » (XVe siècle)",t:"Trace du passé",n:"Écrit"}
];
const SYN=[
{q:"Quelles sont les transformations que nos campagnes subissent au Moyen Âge ?",k:[["population|habitants|27 000 000|27 millions","la population augmente"],["défrich|forêt","défrichement des forêts"],["charrue","charrue"],["collier","collier d'épaule"],["moulin","moulin à vent"],["assolement|triennal","assolement triennal"]],m:"En 250 ans, la population augmente de plus de 27 millions d'habitants (69 millions en 1250). La conséquence première est le défrichement massif des forêts pour s'installer et cultiver. De plus, une série d'innovations techniques facilitent et améliorent le travail agricole : moulin à vent, charrue, collier d'épaule et assolement triennal."},
{q:"Quelle est la fonction du château fort ? (militaire, économique, vie)",k:[["bois","d'abord en bois"],["pierre","puis en pierre"],["protect|défen|sécurité","protection"],["autorité","autorité"],["redevance|impôt","fonction économique"],["banquet|jeu|famille|loisir","lieu de vie"]],m:"Au départ le château est en bois, puis en pierre. Il protège contre les ennemis (donjon, tours, meurtrières) et affirme l'autorité du seigneur. Il est aussi la résidence du seigneur et de sa famille, un lieu de divertissement (banquets, jeux) et un lieu économique où le seigneur perçoit les redevances."},
{q:"Quels rapports existent entre le seigneur et le paysan ?",k:[["protection|protège","le seigneur protège"],["cens","cens"],["corvée","corvées"],["banalité","banalités"],["serf","serf"],["vilain","vilain"]],m:"Le seigneur protège le paysan et lui cède une tenure. En échange, le paysan paie le cens, la taille, les banalités, le champart et fait des corvées sur la réserve. Le vilain est libre ; le serf dépend du seigneur."},
{q:"Présente les trois ordres de la société médiévale.",k:[["prêtre|clergé","prêtres"],["combattant|noble|chevalier","combattants"],["paysan|agriculteur","paysans"],["prie","prient"],["protège|défend","protègent"],["nourri|travail","nourrissent / travaillent"],["complémentaire","complémentaires"]],m:"La société est divisée en trois ordres : les prêtres qui prient, les combattants qui protègent, les paysans qui travaillent et nourrissent. Le texte de 1036 les présente comme complémentaires : chacun est utile aux autres."}
];
OPEN.splice(0,OPEN.length,...[0,1,2,3,7].map(i=>OPEN[i]));
DOCS.splice(0,DOCS.length,
{d:"Description de l'élection de Vézelay par Vauban (1697)",t:"Trace du passé",n:"Écrit"},
{d:"Texte du « Livre des Propriétés des choses » (XVe siècle)",t:"Trace du passé",n:"Écrit"},
{d:"Extrait d'un manuel scolaire d'histoire publié en 2010",t:"Travail postérieur",n:"Écrit"},
{d:"Texte de la « Geste des évêques de Cambrai » (1036)",t:"Trace du passé",n:"Écrit"},
{d:"La moisson, peinture d'Abel Grimmer (1607)",t:"Trace du passé",n:"Iconographique"},
{d:"Reconstitution moderne (dessin) d'un village médiéval",t:"Travail postérieur",n:"Iconographique"});
SYN.splice(0,SYN.length,...[0,2,3].map(i=>SYN[i]));
function norm(x){return x.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')}
let oi,oq;
function open_(){oq=shuf(OPEN).slice(0,5);oi=0;showO()}
function showO(){
if(oi>=oq.length){app.innerHTML=`<div class="big">📝</div><div class="card">Série terminée ! ⭐ ${stars}</div><div class="card">🧘 <b>Pause !</b> Bois de l'eau et étire-toi 1 minute.</div><button class="btn" onclick="open_()">Encore 5 questions</button><button class="btn alt" onclick="home()">🏠 Accueil</button>`;return}
const x=oq[oi];
app.innerHTML=`<div class="bar"><i style="width:${oi/oq.length*100}%"></i></div><span class="tag">Réponds avec tes mots · ${oi+1}/${oq.length}</span>
<div class="card"><b>${x.q}</b></div>
<textarea id="ta" rows="5" placeholder="Écris ta réponse ici..." style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #999"></textarea>
<div id="f"></div><button class="btn" id="go" onclick="revO()">👀 Voir le modèle</button>`}
function revO(){const x=oq[oi];
document.getElementById('go').remove();
document.getElementById('f').innerHTML=`<div class="fb"><b>Mots à retrouver :</b> ${x.k.join(' · ')}</div><div class="fb" style="background:#eef3ff"><b>Modèle :</b><br>${x.m}</div>
<div class="row"><button class="btn bad" onclick="oi++;showO()">🔁 À revoir</button><button class="btn good" onclick="stars+=2;save();oi++;showO()">✅ J'avais l'essentiel</button></div>`}
let di,dq,ds;
function docs(){dq=shuf(DOCS).slice(0,5);di=0;ds=0;showD()}
function showD(){
if(di>=dq.length){stars+=ds;save();app.innerHTML=`<div class="big">🕵️</div><div class="card"><b>${ds} / ${dq.length}</b> documents bien classés.<br>⭐ +${ds}</div><button class="btn" onclick="docs()">Rejouer</button><button class="btn alt" onclick="home()">🏠 Accueil</button>`;return}
const x=dq[di];
app.innerHTML=`<div class="bar"><i style="width:${di/dq.length*100}%"></i></div><span class="tag">Détective des documents · ${di+1}/${dq.length}</span>
<div class="card"><b>${x.d}</b></div>
<div class="small">1) Trace du passé ou travail postérieur ?</div>
<div class="row" id="r1"><button class="btn alt" onclick="pickD(1,'Trace du passé')">Trace du passé</button><button class="btn alt" onclick="pickD(1,'Travail postérieur')">Travail postérieur</button></div>
<div class="small">2) Nature du document ?</div>
<div class="row" id="r2"><button class="btn alt" onclick="pickD(2,'Écrit')">Écrit</button><button class="btn alt" onclick="pickD(2,'Iconographique')">Image</button><button class="btn alt" onclick="pickD(2,'Archéologique')">Archéo.</button></div>
<div id="f"></div>`;
window.pa=null;window.pb=null}
function pickD(k,v){if(k==1)window.pa=v;else window.pb=v;
const r=document.getElementById('r'+k);[...r.children].forEach(b=>{b.className='btn alt';if(b.textContent.startsWith(v.slice(0,4))||(v==='Iconographique'&&b.textContent==='Image')||(v==='Archéologique'&&b.textContent==='Archéo.'))b.className='btn'});
if(window.pa&&window.pb){const x=dq[di],ok=window.pa===x.t&&window.pb===x.n;if(ok)ds++;
document.getElementById('f').innerHTML=`<div class="fb">${ok?'✅ Bravo !':'❌ Réponse : '+x.t+' · '+x.n}</div><button class="btn" onclick="di++;showD()">Suivant ➡️</button>`}}
let yi;
function syn(){yi=0;showY(shuf(SYN)[0])}
function showY(x){
app.innerHTML=`<span class="tag">Écrire une synthèse</span><div class="card"><b>${x.q}</b></div>
<div class="small">Écris 5 phrases qui répondent à la question, en reliant les idées.</div>
<textarea id="ta" rows="8" style="width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid #999"></textarea>
<div id="f"></div><button class="btn" id="go">✔️ Vérifier mes mots-clés</button>`;
document.getElementById('go').onclick=()=>{
const t=norm(document.getElementById('ta').value);let n=0;
const rows=x.k.map(p=>{const ok=p[0].split('|').some(w=>t.includes(norm(w)));if(ok)n++;return `<div>${ok?'✅':'⬜'} ${p[1]}</div>`}).join('');
stars+=n>=Math.ceil(x.k.length*0.7)?2:0;save();
document.getElementById('f').innerHTML=`<div class="fb"><b>${n} / ${x.k.length}</b> idées trouvées<br>${rows}</div><div class="fb" style="background:#eef3ff"><b>Modèle :</b><br>${x.m}</div><button class="btn" onclick="syn()">Une autre synthèse</button><button class="btn alt" onclick="home()">🏠 Accueil</button>`;
document.getElementById('go').remove()}}
home();
</script>
</body>
</html>
